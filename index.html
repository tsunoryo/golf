<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>モバイル 3D ゴルフ Ultimate</title>
    <!-- Three.jsの安定版CDNを読み込み -->
    <script src="https://cloudflare.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #1a1a1a; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #header-ui { background: #2c3e50; color: white; padding: 10px; display: flex; justify-content: space-around; font-size: 13px; font-weight: bold; border-bottom: 2px solid #34495e; z-index: 10; }
        .ui-val { font-size: 16px; color: #f1c40f; display: block; text-align: center; }
        #game-container { flex: 1; position: relative; background: #27ae60; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        
        #distance-display { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.6); color: #fff; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; pointer-events: none; z-index: 10; }
        #power-display { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); color: #f1c40f; padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; pointer-events: none; display: none; z-index: 10; }
        #green-info { position: absolute; top: 50px; left: 12px; background: rgba(231, 76, 60, 0.85); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: none; pointer-events: none; z-index: 10; }

        #footer-ui { background: #2c3e50; padding: 12px 12px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; border-top: 2px solid #34495e; z-index: 10; }
        #club-selector { display: flex; justify-content: space-between; gap: 6px; }
        .club-btn { flex: 1; padding: 14px 0; background: #34495e; color: #bdc3c7; border: 2px solid #7f8c8d; border-radius: 8px; font-weight: bold; font-size: 13px; }
        .club-btn.active { background: #e74c3c; color: white; border-color: #f1c40f; }
        
        #gauge-container { width: 100%; height: 24px; background: #34495e; border-radius: 12px; position: relative; overflow: hidden; border: 2px solid #bdc3c7; }
        #just-area { position: absolute; left: 44%; width: 12%; height: 100%; background: #ffffff; box-shadow: 0 0 10px #fff; }
        #gauge-bar { position: absolute; left: 0; top: 0; width: 6px; height: 100%; background: #f1c40f; transition: none; }
        #guide-text { color: #ecf0f1; text-align: center; font-size: 12px; font-weight: bold; }
        
        #result-overlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); color:white; z-index:100; flex-direction:column; justify-content:center; align-items:center; padding:20px; }
        .score-table { width: 100%; max-width: 340px; border-collapse: collapse; margin: 20px 0; font-size: 12px; text-align: center; }
        .score-table th, .score-table td { border: 1px solid #7f8c8d; padding: 6px 4px; }
    </style>
</head>
<body>
    <div id="header-ui">
        <div>HOLE<span id="ui-hole" class="ui-val">1/9</span></div>
        <div>PAR<span id="ui-par" class="ui-val">4</span></div>
        <div>WIND<span id="ui-wind" class="ui-val">➔ 0m</span></div>
        <div>STROKE<span id="ui-stroke" class="ui-val">0</span></div>
        <div>TOTAL<span id="ui-total" class="ui-val">E</span></div>
    </div>
    <div id="game-container">
        <div id="distance-display">残り: <span id="ui-dist">---</span>y</div>
        <div id="green-info">⛳ 芝目: ➔ (強)</div>
        <div id="power-display">パワー: <span id="ui-power">0</span>%</div>
    </div>
    <div id="footer-ui">
        <div id="gauge-container">
            <div id="just-area"></div>
            <div id="gauge-bar"></div>
        </div>
        <div id="club-selector">
            <button class="club-btn active" onclick="selectClub('1W')">1W (160y)</button>
            <button class="club-btn" onclick="selectClub('7I')">7I (100y)</button>
            <button class="club-btn" onclick="selectClub('PT')">PT (30y)</button>
        </div>
        <div id="guide-text">①引っ張って強さを調整 ➔ ②中央の白枠で再タップ！</div>
    </div>
    <div id="result-overlay">
        <h2>🎉 ROUND COMPLETED!</h2>
        <table class="score-table" id="scoreTable"></table>
        <button style="padding:12px 30px; background:#2ecc71; color:white; border:none; border-radius:25px; font-weight:bold;" onclick="restartGame()">もう一度プレイ</button>
    </div>

    <script>
        const container = document.getElementById("game-container");
        const VIEW_W = 360; 
        let scene, camera, renderer;
        let ballMesh, holeMesh, flagMesh, courseGroup;
        let currentHoleIndex = 0, scores = Array(9).fill(0), currentStroke = 0;
        
        let ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, radius: 1.2, isMoving: false, hangTime: 0, lastX: 0, lastZ: 0 };
        let hole = { x: 0, z: 0, radius: 4 };
        let currentClub = '1W', touchStart = null, touchCurrent = null, isDragging = false;
        let wind = { angle: 0, speed: 0 }, greenSlope = { angle: 0, speed: 0, text: "" };
        const PX_TO_YARD = 0.25;

        const COURSE_DATA = [
            { par: 4, bX: 180, bY: 1350, hX: 180, hY: 120, gR: 50, height: 1500, hazards: [{t:'bunker',x:130,y:800,rx:40,ry:25},{t:'bunker',x:230,y:450,rx:35,ry:25}], fwPoints: [{x:140,y:1450},{x:220,y:1450},{x:220,y:700},{x:300,y:400},{x:240,y:50},{x:120,y:50},{x:100,y:400},{x:140,y:700}] },
            { par: 3, bX: 180, bY: 850,  hX: 180, hY: 100, gR: 45, height: 1000, hazards: [{t:'pond',x:180,y:480,rx:110,ry:45}], fwPoints: [{x:130,y:950},{x:230,y:950},{x:230,y:600},{x:250,y:250},{x:110,y:250},{x:130,y:600}] },
            { par: 4, bX: 80,  bY: 1450, hX: 280, hY: 150, gR: 50, height: 1600, hazards: [{t:'pond',x:200,y:950,rx:60,ry:60},{t:'bunker',x:280,y:550,rx:35,ry:35}], fwPoints: [{x:40,y:1550},{x:120,y:1550},{x:140,y:1100},{x:320,y:800},{x:340,y:100},{x:200,y:100},{x:220,y:700},{x:40,y:1100}] },
            { par: 5, bX: 180, bY: 1850, hX: 180, hY: 120, gR: 55, height: 2000, hazards: [{t:'bunker',x:130,y:1400,rx:45,ry:30},{t:'pond',x:220,y:950,rx:80,ry:60},{t:'bunker',x:230,y:450,rx:40,ry:30}], fwPoints: [{x:130,y:1950},{x:230,y:1950},{x:250,y:1300},{x:120,y:900},{x:140,y:500},{x:240,y:250},{x:220,y:50},{x:120,y:50},{x:60,y:300},{x:60,y:700},{x:150,y:1200},{x:130,y:1500}] },
            { par: 4, bX: 280, bY: 1250, hX: 90,  hY: 120, gR: 45, height: 1400, hazards: [{t:'bunker',x:180,y:700,rx:60,ry:25}], fwPoints: [{x:220,y:1350},{x:320,y:1350},{x:300,y:700},{x:160,y:400},{x:160,y:50},{x:40,y:50},{x:40,y:500},{x:140,y:800}] },
            { par: 3, bX: 180, bY: 850,  hX: 270, hY: 120, gR: 45, height: 1000, hazards: [{t:'pond',x:100,y:450,rx:55,ry:55}], fwPoints: [{x:130,y:950},{x:230,y:950},{x:250,y:500},{x:330,y:250},{x:210,y:250},{x:150,y:500}] },
            { par: 5, bX: 180, bY: 1850, hX: 180, hY: 150, gR: 50, height: 2000, hazards: [{t:'pond',x:200,y:1400,rx:80,ry:45},{t:'bunker',x:90,y:950,rx:45,ry:35},{t:'pond',x:180,y:520,rx:70,ry:40}], fwPoints: [{x:140,y:1950},{x:220,y:1950},{x:260,y:1500},{x:150,y:1100},{x:140,y:700},{x:260,y:350},{x:240,y:50},{x:120,y:50},{x:80,y:400},{x:40,y:800},{x:60,y:1300},{x:60,y:1600}] },
            { par: 4, bX: 180, bY: 1350, hX: 180, hY: 120, gR: 50, height: 1500, hazards: [{t:'bunker',x:110,y:750,rx:40,ry:40},{t:'bunker',x:250,y:750,rx:40,ry:40}], fwPoints: [{x:140,y:1450},{x:220,y:1450},{x:240,y:900},{x:250,y:400},{x:230,y:50},{x:130,y:50},{x:110,y:400},{x:120,y:900}] },
            { par: 4, bX: 180, bY: 1450, hX: 180, hY: 120, gR: 55, height: 1600, hazards: [{t:'pond',x:180,y:1050,rx:90,ry:45}], fwPoints: [{x:130,y:1550},{x:230,y:1550},{x:280,y:1100},{x:140,y:700},{x:240,y:300},{x:230,y:50},{x:130,y:50},{x:100,y:300},{x:200,y:700},{x:80,y:1100}] }
        ];

        let gauge = { active: false, value: 0, dir: 1, speed: 3, savedPower: 0, savedAngle: 0, savedDist: 0 };
        const CLUBS = { 
            '1W': { p: 0.170, f: 0.965, air: true, max: 15, maxDisperse: 0.35, speed: 3.2, maxPull: 150, targetY: 160 }, 
            '7I': { p: 0.155, f: 0.950, air: true, max: 25, maxDisperse: 0.18, speed: 2.2, maxPull: 110, targetY: 100 },  
            'PT': { p: 0.115, f: 0.910, air: false, max: 0, maxDisperse: 0.04, speed: 1.2, maxPull: 70, targetY: 30 }   
        };
        function init() {
            const w = container.clientWidth, h = container.clientHeight;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee);

            camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 3000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
            scene.add(ambientLight);
            
            const sunLight = new THREE.DirectionalLight(0xffffff, 0.75);
            sunLight.position.set(200, 400, 200);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 2500;
            const dCam = 600;
            sunLight.shadow.camera.left = -dCam; sunLight.shadow.camera.right = dCam;
            sunLight.shadow.camera.top = dCam; sunLight.shadow.camera.bottom = -dCam;
            scene.add(sunLight);

            courseGroup = new THREE.Group();
            scene.add(courseGroup);

            const ballGeo = new THREE.SphereGeometry(ball.radius, 18, 18);
            const ballMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            ballMesh = new THREE.Mesh(ballGeo, ballMat);
            ballMesh.castShadow = true;
            scene.add(ballMesh);

            const flagPoleGeo = new THREE.CylinderGeometry(0.4, 0.4, 30, 8);
            const flagPoleMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
            const pole = new THREE.Mesh(flagPoleGeo, flagPoleMat);
            pole.position.y = 15;
            
            const clothGeo = new THREE.ConeGeometry(4, 5, 3);
            const clothMat = new THREE.MeshBasicMaterial({ color: 0xe74c3c });
            const cloth = new THREE.Mesh(clothGeo, clothMat);
            cloth.position.set(0, 27, 0); cloth.rotation.z = Math.PI / 2;

            flagMesh = new THREE.Group();
            flagMesh.add(pole); flagMesh.add(cloth);
            scene.add(flagMesh);

            loadHole(currentHoleIndex);

            container.addEventListener("touchstart", handleStart, {passive: false});
            container.addEventListener("touchmove", handleMove, {passive: false});
            container.addEventListener("touchend", handleEnd, {passive: false});
            container.addEventListener("mousedown", handleStart);
            container.addEventListener("mousemove", handleMove);
            container.addEventListener("mouseup", handleEnd);
            window.addEventListener('resize', onWindowResize);

            window.requestAnimationFrame(gameLoop);
        }

        function loadHole(idx) {
            const d = COURSE_DATA[idx];
            document.getElementById("ui-hole").innerText = `${idx + 1}/9`;
            document.getElementById("ui-par").innerText = d.par;
            currentStroke = 0; document.getElementById("ui-stroke").innerText = 0;

            wind.angle = Math.random() * Math.PI * 2; wind.speed = Math.floor(Math.random() * 7);
            document.getElementById("ui-wind").innerText = `${wind.speed}m (${Math.round(wind.angle * 180 / Math.PI)}°)`;

            greenSlope.angle = Math.random() * Math.PI * 2; greenSlope.speed = 0.025 + Math.random() * 0.035;
            const dirs = ["➔ 右", "➔ 下", "➔ 左", "➔ 上"];
            greenSlope.text = `⛳ 芝目: ${dirs[Math.floor(((greenSlope.angle + Math.PI/4) % (Math.PI * 2)) / (Math.PI / 2))]}傾斜`;
            document.getElementById("green-info").innerText = greenSlope.text;
            updateScore();

            // 2D座標(180)を3D(0)に中心補正
            ball.x = d.bX - 180; ball.y = 0; ball.z = d.bY;
            ball.vx = 0; ball.vy = 0; ball.vz = 0; ball.isMoving = false;
            hole.x = d.hX - 180; hole.z = d.hY;
            
            ballMesh.position.set(ball.x, ball.y + ball.radius, ball.z);
            flagMesh.position.set(hole.x, 0, hole.z);

            while(courseGroup.children.length > 0){
                courseGroup.remove(courseGroup.children[0]);
            }

            const roughGeo = new THREE.PlaneGeometry(1200, d.height + 400);
            const roughMat = new THREE.MeshStandardMaterial({ color: 0x1e824c, roughness: 0.9 });
            const roughMesh = new THREE.Mesh(roughGeo, roughMat);
            roughMesh.rotation.x = -Math.PI / 2; roughMesh.position.set(0, -0.2, d.height / 2);
            roughMesh.receiveShadow = true;
            courseGroup.add(roughMesh);

            const fwShape = new THREE.Shape();
            fwShape.moveTo(d.fwPoints[0].x - 180, d.fwPoints[0].y);
            for(let i = 1; i < d.fwPoints.length; i++) {
                fwShape.lineTo(d.fwPoints[i].x - 180, d.fwPoints[i].y);
            }
            const fwGeo = new THREE.ShapeGeometry(fwShape);
            const fwMat = new THREE.MeshStandardMaterial({ color: 0x2ecc71, roughness: 0.75 });
            const fwMesh = new THREE.Mesh(fwGeo, fwMat);
            fwMesh.rotation.x = -Math.PI / 2; fwMesh.position.y = 0.01;
            fwMesh.receiveShadow = true;
            courseGroup.add(fwMesh);

            const greenGeo = new THREE.CircleGeometry(d.gR, 32);
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x26ae5f, roughness: 0.6 });
            const grMesh = new THREE.Mesh(greenGeo, greenMat);
            grMesh.rotation.x = -Math.PI / 2; grMesh.position.set(hole.x, 0.02, hole.z);
            grMesh.receiveShadow = true;
            courseGroup.add(grMesh);

            d.hazards.forEach(h => {
                const hzGeo = new THREE.CircleGeometry(1, 32);
                let hzMat = h.t === 'bunker' ? 
                    new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.95 }) : 
                    new THREE.MeshStandardMaterial({ color: 0x3498db, roughness: 0.2 });
                const hzMesh = new THREE.Mesh(hzGeo, hzMat);
                hzMesh.rotation.x = -Math.PI / 2; hzMesh.scale.set(h.rx, h.ry, 1);
                hzMesh.position.set(h.x - 180, (h.t === 'bunker' ? 0.03 : 0.025), h.y);
                hzMesh.receiveShadow = true;
                courseGroup.add(hzMesh);
            });

            selectClub('1W'); updateCamera(); resetGauge(); updateDistanceDisplay();
        }

        function selectClub(c) { if(gauge.active) return; currentClub = c; document.querySelectorAll(".club-btn").forEach(b => b.classList.toggle("active", b.innerText.includes(c))); }
        function resetGauge() { gauge.active = false; gauge.value = 0; gauge.dir = 1; document.getElementById("gauge-bar").style.left = "0%"; document.getElementById("guide-text").innerText = "①引っ張って強さを調整 ➔ ②中央の白枠で再タップ！"; document.getElementById("power-display").style.display = "none"; }
        function updateDistanceDisplay() { document.getElementById("ui-dist").innerText = Math.round(Math.hypot(ball.x - hole.x, ball.z - hole.z) * PX_TO_YARD); }
        function onWindowResize() { camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight); }

        function getEventScreenXY(e) {
            let cx = 0, cy = 0;
            if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            else if (e.changedTouches && e.changedTouches.length > 0) { cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
            else { cx = e.clientX; cy = e.clientY; }
            return { x: cx, y: cy };
        }

        function handleStart(e) { 
            e.preventDefault(); if (gauge.active) { triggerShot(); return; } if (ball.isMoving) return;
            const evPos = getEventScreenXY(e); touchStart = { x: evPos.x, y: evPos.y }; touchCurrent = { ...touchStart }; isDragging = true; 
            document.getElementById("ui-power").innerText = "0"; document.getElementById("power-display").style.display = "block";
        }
        function handleMove(e) { 
            if (!isDragging || gauge.active) return; e.preventDefault(); 
            const evPos = getEventScreenXY(e); touchCurrent = { x: evPos.x, y: evPos.y }; 
            const dist = Math.hypot(touchCurrent.x - touchStart.x, touchCurrent.y - touchStart.y), c = CLUBS[currentClub];
            document.getElementById("ui-power").innerText = Math.min(Math.round((dist / c.maxPull) * 100), 100);
        }
        function handleEnd(e) { 
            if (!isDragging || gauge.active) return; isDragging = false; 
            const evPos = getEventScreenXY(e); touchCurrent = { x: evPos.x, y: evPos.y }; 
            let dx = touchCurrent.x - touchStart.x, dy = touchCurrent.y - touchStart.y; let dist = Math.hypot(dx, dy); 
            if (dist > 15) { 
                const c = CLUBS[currentClub]; if (dist > c.maxPull) { const ratio = c.maxPull / dist; dx *= ratio; dy *= ratio; dist = c.maxPull; }
                gauge.savedPower = ((c.targetY / PX_TO_YARD) * (1 - c.f)) * (dist / c.maxPull) * 5.2;
                gauge.savedAngle = Math.atan2(-dy, -dx); gauge.savedDist = dist;
                gauge.active = true; gauge.value = 0; gauge.dir = 1; gauge.speed = c.speed;
                document.getElementById("guide-text").innerText = "🔴 画面を今すぐタップしてタイミングよく止めて！";
            } else { document.getElementById("power-display").style.display = "none"; }
            touchStart = null;
        }
        function triggerShot() {
            gauge.active = false; ball.lastX = ball.x; ball.lastZ = ball.z; const c = CLUBS[currentClub];
            let accuracyOffset = Math.abs(gauge.value - 50); let finalAngle = gauge.savedAngle;
            if (accuracyOffset > 6) {
                let penaltySign = (gauge.value > 50) ? 1 : -1;
                finalAngle += penaltySign * (accuracyOffset / 50) * c.maxDisperse * (gauge.savedDist / c.maxPull);
                document.getElementById("guide-text").innerText = "❌ ミスショット！弾道が左右に曲がりました！";
            } else { document.getElementById("guide-text").innerText = "✨ NICE SHOT!! 完璧なストレート！"; }
            
            // 3D空間の進行方向(Z座標のマイナス方向がピン方向)へマッピング
            ball.vx = Math.cos(finalAngle) * gauge.savedPower * 0.25;
            ball.vz = Math.sin(finalAngle) * gauge.savedPower * 0.25;
            ball.isMoving = true; ball.hangTime = Math.min(gauge.savedDist * 0.35, c.max); updateScore(); 
        }

        function updateScore() { let t = 0; for(let i=0; i<=currentHoleIndex; i++) if(scores[i]>0) t += (scores[i] - COURSE_DATA[i].par); document.getElementById("ui-total").innerText = t === 0 ? "E" : (t > 0 ? `+${t}` : t); }
        
        function gameLoop() { 
            if (gauge.active) { 
                gauge.value += gauge.speed * gauge.dir; 
                if (gauge.value >= 100) { gauge.value = 100; gauge.dir = -1; } 
                if (gauge.value <= 0) { gauge.value = 0; gauge.dir = 1; } 
                document.getElementById("gauge-bar").style.left = gauge.value + "%"; 
            } 
            updateLogic(); updateCamera(); renderer.render(scene, camera); window.requestAnimationFrame(gameLoop); 
        }

        function updateLogic() { 
            const d = COURSE_DATA[currentHoleIndex]; 
            if (ball.isMoving) { 
                const c = CLUBS[currentClub]; 
                if (c.air && ball.hangTime > 0) { 
                    ball.hangTime--; ball.y = Math.sin((ball.hangTime / c.max) * Math.PI) * 45; 
                    ball.vx += Math.cos(wind.angle) * (wind.speed * 0.003); ball.vz += Math.sin(wind.angle) * (wind.speed * 0.003);
                } else { ball.y = 0; } 

                let distToHole = Math.hypot(ball.x - hole.x, ball.z - hole.z), inGreen = distToHole < d.gR;
                if (ball.y <= 0 && inGreen) { ball.vx += Math.cos(greenSlope.angle) * greenSlope.speed * 0.1; ball.vz += Math.sin(greenSlope.angle) * greenSlope.speed * 0.1; }
                ball.x += ball.vx; ball.z += ball.vz; let fr = c.f, pond = false; 
                
                if (ball.y <= 0) { 
                    // 2D座標系に戻してハザード判定を行う（ハザードデータは2Dベースのため）
                    let raw2DX = ball.x + 180, raw2DY = ball.z;
                    d.hazards.forEach(h => { if (Math.pow(raw2DX - h.x, 2) / Math.pow(h.rx, 2) + Math.pow(raw2DY - h.y, 2) / Math.pow(h.ry, 2) <= 1) { if (h.t === 'bunker') fr = 0.80; else pond = true; } }); 
                    if (!inGreen) {
                        let insideFairway = false;
                        for (let i = 0, j = d.fwPoints.length - 1; i < d.fwPoints.length; j = i++) {
                            let xi = d.fwPoints[i].x, yi = d.fwPoints[i].y, xj = d.fwPoints[j].x, yj = d.fwPoints[j].y;
                            if (((yi > raw2DY) != (yj > raw2DY)) && (raw2DX < (xj - xi) * (raw2DY - yi) / (yj - yi) + xi)) insideFairway = !insideFairway;
                        }
                        if (!insideFairway) fr = Math.min(fr, 0.84);
                    }
                } 
                if (pond) { 
                    alert("🌊 ウォーターハザード！ 1打罰で打ち直し。"); ball.x = ball.lastX; ball.z = ball.lastZ; ball.vx = 0; ball.vz = 0; ball.isMoving = false; ball.y = 0;
                    currentStroke++; scores[currentHoleIndex] = currentStroke; document.getElementById("ui-stroke").innerText = currentStroke; updateScore(); updateCamera(); resetGauge(); updateDistanceDisplay(); return; 
                } 
                ball.vx *= fr; ball.vz *= fr; 
                if (ball.x < -180 || ball.x > 180) ball.vx *= -0.4; 
                if (ball.z < 0 || ball.z > d.height) ball.vz *= -0.4; 
                
                if (Math.hypot(ball.vx, ball.vz) < 0.04 && ball.y <= 0) { ball.vx = 0; ball.vz = 0; ball.isMoving = false; currentStroke++; document.getElementById("ui-stroke").innerText = currentStroke; resetGauge(); } 
                if (ball.y <= 0 && Math.hypot(ball.vx, ball.vz) < 2.5 && distToHole < hole.radius + 2) { ball.vx = 0; ball.vz = 0; ball.isMoving = false; currentStroke++; handleHoleOut(); return; } 
                updateDistanceDisplay();
            } 
            ballMesh.position.set(ball.x, ball.y + ball.radius, ball.z);
            document.getElementById("green-info").style.display = (Math.hypot(ball.x - hole.x, ball.z - hole.z) < d.gR && !ball.isMoving) ? "block" : "none";
        }

        function updateCamera() {
            if (!ball.isMoving) {
                // 打つ前：ボールの後ろからピン方向（Zのマイナス方向）を見据えるカメラワーク
                camera.position.set(ball.x, ball.y + 22, ball.z + 55);
                camera.lookAt(hole.x, 5, hole.z);
            } else {
                // 移動中：ダイナミック追跡
                camera.position.set(ball.x, ball.y + 35, ball.z + 65);
                camera.lookAt(ballMesh.position);
            }
        }

        function handleHoleOut() { alert(`⛳️ HOLE OUT! \n\n結果: ${currentStroke}ストローク`); if (currentHoleIndex < 8) { currentHoleIndex++; loadHole(currentHoleIndex); } else { showResults(); } }
        function showResults() { const o = document.getElementById("result-overlay"), t = document.getElementById("scoreTable"); t.innerHTML = `<tr><th>Hole</th>${Array.from({length:9},(_,i)=>`<td>${i+1}</td>`).join('')}<td>TTL</td></tr><tr><th>Par</th>${COURSE_DATA.map(d=>`<td>${d.par}</td>`).join('')}<td>36</td></tr><tr><th>Score</th>${scores.map(s=>`<td>${s}</td>`).join('')}<td>${scores.reduce((a,b)=>a+b,0)}</td></tr>`; o.style.display = "flex"; }
        function restartGame() { document.getElementById("result-overlay").style.display = "none"; currentHoleIndex = 0; scores = Array(9).fill(0); loadHole(0); }
        
        window.onload = init;
    </script>
</body>
</html>
