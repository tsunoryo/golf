<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>シンプル 2D ゴルフ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #222; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #ui { color: white; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        canvas { background: #4caf50; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.5); border-radius: 8px; }
    </style>
</head>
<body>
    <div id="ui">SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // スマホに合わせた縦長固定画面
        canvas.width = 360;
        canvas.height = 540;

        let ball = { x: 180, y: 450, vx: 0, vy: 0, radius: 8, isMoving: false };
        let hole = { x: 180, y: 90, radius: 14 };
        let score = 0;
        let touchStart = null, touchCurrent = null, isDragging = false;

        function init() {
            // マウスとタッチのイベント登録
            canvas.addEventListener("touchstart", handleStart, {passive: false});
            canvas.addEventListener("touchmove", handleMove, {passive: false});
            canvas.addEventListener("touchend", handleEnd, {passive: false});
            canvas.addEventListener("mousedown", handleStart);
            canvas.addEventListener("mousemove", handleMove);
            canvas.addEventListener("mouseup", handleEnd);
            window.requestAnimationFrame(gameLoop);
        }

        function getEventXY(e) {
            let cx = 0, cy = 0;
            if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            else { cx = e.clientX; cy = e.clientY; }
            return { x: cx, y: cy };
        }

        function handleStart(e) {
            e.preventDefault();
            if (ball.isMoving) return;
            const pos = getEventXY(e);
            const rect = canvas.getBoundingClientRect();
            touchStart = { x: pos.x - rect.left, y: pos.y - rect.top };
            touchCurrent = { ...touchStart };
            isDragging = true;
        }

        function handleMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            const pos = getEventXY(e);
            const rect = canvas.getBoundingClientRect();
            touchCurrent = { x: pos.x - rect.left, y: pos.y - rect.top };
        }

        function handleEnd(e) {
            if (!isDragging) return;
            isDragging = false;
            
            // 引っ張った距離と方向を計算
            const dx = touchCurrent.x - touchStart.x;
            const dy = touchCurrent.y - touchStart.y;
            const dist = Math.hypot(dx, dy);

            if (dist > 10) {
                // 引っ張った方向と逆（前方）へ飛ばす。最大パワー制限付き
                const power = Math.min(dist * 0.12, 15);
                const angle = Math.atan2(dy, dx);
                ball.vx = -Math.cos(angle) * power;
                ball.vy = -Math.sin(angle) * power;
                ball.isMoving = true;
                score++;
                document.getElementById("score").innerText = score;
            }
            touchStart = null;
            touchCurrent = null;
        }

        function gameLoop() {
            // 物理移動とグリーン摩擦による減速
            if (ball.isMoving) {
                ball.x += ball.vx;
                ball.y += ball.vy;
                ball.vx *= 0.96; // なめらかな減速
                ball.vy *= 0.96;

                // 壁の跳ね返り
                if (ball.x < ball.radius || ball.x > canvas.width - ball.radius) { ball.vx *= -0.8; ball.x = ball.x < ball.radius ? ball.radius : canvas.width - ball.radius; }
                if (ball.y < ball.radius || ball.y > canvas.height - ball.radius) { ball.vy *= -0.8; ball.y = ball.y < ball.radius ? ball.radius : canvas.height - ball.radius; }

                // 完全停止判定
                if (Math.hypot(ball.vx, ball.vy) < 0.15) {
                    ball.vx = 0; ball.vy = 0; ball.isMoving = false;
                }

                // カップイン判定
                if (Math.hypot(ball.x - hole.x, ball.y - hole.y) < hole.radius) {
                    ball.vx = 0; ball.vy = 0; ball.isMoving = false;
                    setTimeout(() => {
                        alert(`カップイン！ 打数: ${score}`);
                        score = 0; document.getElementById("score").innerText = score;
                        ball.x = 180; ball.y = 450; // 位置リセット
                    }, 100);
                }
            }

            // 描画処理
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // カップ（穴）
            ctx.fillStyle = "#111";
            ctx.beginPath(); ctx.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2); ctx.fill();

            // 引っぱり中のガイド線
            if (isDragging && touchStart && touchCurrent) {
                ctx.strokeStyle = "rgba(255,255,255,0.6)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(ball.x - (touchCurrent.x - touchStart.x), ball.y - (touchCurrent.y - touchStart.y));
                ctx.stroke();
            }

            // ボール
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill();

            window.requestAnimationFrame(gameLoop);
        }

        window.onload = init;
    </script>
</body>
</html>
