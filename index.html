<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>プチみんゴル - Web Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background-color: #4CAF50;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: bold;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
        }
        .ui-box {
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        #message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFEB3B;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 3px 3px 0px #000;
            text-align: center;
            width: 100%;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">
        <div class="ui-box" id="leftUi">
            HOLE: 1 (PAR 4)<br>
            残り: <span id="distance">---</span> Y
        </div>
        <div class="ui-box" id="rightUi">
            風: <span id="wind">北 2m</span><br>
            SCORE: <span id="score">0</span> (<span id="strokes">0</span>打目)
        </div>
    </div>
    <div id="message">NICE SHOT!</div>
    <canvas id="gameCanvas"></canvas>
</div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('message');

// 画面解像度調整
function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ゲームオブジェクト・設定値
const game = {
    state: 'aim', // aim, pulling, timing, flying, cupin
    score: 0,
    strokes: 0,
    ball: { x: 0, y: 0, vx: 0, vy: 0, radius: 6 },
    cup: { x: 0, y: 0, radius: 12 },
    tee: { x: 0, y: 0 },
    wind: { angle: 0, speed: 0 },
    
    // 操作用
    touchStart: { x: 0, y: 0 },
    pullDist: 0,
    maxPull: 120,
    
    // タイミングゲージ用
    timingCircle: 60,
    timingSpeed: 2.5,
    timingSuccess: 0
};

// コース初期化
function initHole() {
    game.state = 'aim';
    game.strokes = 0;
    
    game.tee.x = canvas.width / 2;
    game.tee.y = canvas.height * 0.8;
    
    game.cup.x = canvas.width / 2 + (Math.random() * 80 - 40);
    game.cup.y = canvas.height * 0.2;
    
    game.ball.x = game.tee.x;
    game.ball.y = game.tee.y;
    game.ball.vx = 0;
    game.ball.vy = 0;
    
    game.wind.angle = Math.random() * Math.PI * 2;
    game.wind.speed = Math.floor(Math.random() * 6) + 1;
    
    updateUi();
}

function updateUi() {
    const dx = game.cup.x - game.ball.x;
    const dy = game.cup.y - game.ball.y;
    const distanceYards = Math.floor(Math.sqrt(dx*dx + dy*dy) * 0.5);
    
    document.getElementById('distance').innerText = distanceYards;
    document.getElementById('strokes').innerText = game.strokes + 1;
    document.getElementById('score').innerText = game.score;
    
    const deg = (game.wind.angle * 180 / Math.PI) % 360;
    let dir = "南";
    if (deg > 45 && deg <= 135) dir = "西";
    else if (deg > 135 && deg <= 225) dir = "北";
    else if (deg > 225 && deg <= 315) dir = "東";
    document.getElementById('wind').innerText = `${dir} ${game.wind.speed}m`;
}

function showMessage(text, duration = 2000) {
    msgEl.innerText = text;
    msgEl.style.display = 'block';
    setTimeout(() => { msgEl.style.display = 'none'; }, duration);
}

function getEventPos(e) {
    const t = e.touches ? e.touches : e;
    const rect = canvas.getBoundingClientRect();
    return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}
function onStart(e) {
    if (game.state !== 'aim') return;
    const pos = getEventPos(e);
    game.touchStart = pos;
    game.state = 'pulling';
    game.pullDist = 0;
}

function onMove(e) {
    if (game.state !== 'pulling') return;
    const pos = getEventPos(e);
    const dy = pos.y - game.touchStart.y;
    game.pullDist = Math.max(0, Math.min(game.maxPull, dy));
}

function onEnd() {
    if (game.state !== 'pulling') return;
    if (game.pullDist > 15) {
        game.state = 'timing';
        game.timingCircle = 60;
    } else {
        game.state = 'aim';
    }
}

function triggerShot() {
    if (game.state !== 'timing') return;
    
    const accuracy = Math.abs(game.timingCircle - game.ball.radius);
    game.strokes++;
    
    const targetDx = game.cup.x - game.ball.x;
    const targetDy = game.cup.y - game.ball.y;
    const angle = Math.atan2(targetDy, targetDx);
    
    const powerRatio = game.pullDist / game.maxPull;
    const baseSpeed = powerRatio * 15;
    
    let deviation = 0;
    if (accuracy > 10) {
        deviation = (Math.random() - 0.5) * (accuracy * 0.02);
        showMessage("MISSHOT!", 1000);
    } else {
        showMessage("NICE SHOT!", 1000);
    }
    
    game.ball.vx = Math.cos(angle + deviation) * baseSpeed;
    game.ball.vy = Math.sin(angle + deviation) * baseSpeed;
    game.ball.vx += Math.cos(game.wind.angle) * game.wind.speed * 0.1;
    game.ball.vy += Math.sin(game.wind.angle) * game.wind.speed * 0.1;
    
    game.state = 'flying';
}

canvas.addEventListener('mousedown', onStart);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', (e) => {
    if (game.state === 'pulling') onEnd();
    else if (game.state === 'timing') triggerShot();
});

canvas.addEventListener('touchstart', onStart, {passive: false});
window.addEventListener('touchmove', onMove, {passive: false});
window.addEventListener('touchend', () => {
    if (game.state === 'pulling') onEnd();
    else if (game.state === 'timing') triggerShot();
});

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

function update() {
    if (game.state === 'timing') {
        game.timingCircle -= game.timingSpeed;
        if (game.timingCircle < 0) {
            game.timingCircle = 0;
            triggerShot();
        }
    }
    if (game.state === 'flying') {
        game.ball.x += game.ball.vx;
        game.ball.y += game.ball.vy;
        game.ball.vx *= 0.95;
        game.ball.vy *= 0.95;
        
        if (Math.abs(game.ball.vx) < 0.05 && Math.abs(game.ball.vy) < 0.05) {
            game.ball.vx = 0;
            game.ball.vy = 0;
            const dx = game.cup.x - game.ball.x;
            const dy = game.cup.y - game.ball.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < game.cup.radius) {
                game.state = 'cupin';
                const finalScore = game.strokes - 4;
                game.score += finalScore;
                let scoreText = finalScore === 0 ? "PAR" : (finalScore < 0 ? "BIRDIE!" : "BOGEY");
                if (game.strokes === 1) scoreText = "HOLE IN ONE!!!";
                showMessage(`CUP IN!\n${scoreText}`, 3000);
                setTimeout(initHole, 3000);
            } else {
                game.state = 'aim';
                updateUi();
            }
        }
    }
}

function draw() {
    ctx.fillStyle = '#4CAF50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = '#81C784';
    ctx.beginPath();
    ctx.arc(game.cup.x, game.cup.y, 80, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath();
    ctx.arc(game.cup.x, game.cup.y, game.cup.radius, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(game.cup.x, game.cup.y);
    ctx.lineTo(game.cup.x, game.cup.y - 20);
    ctx.stroke();
    ctx.fillStyle = '#e91e63';
    ctx.beginPath();
    ctx.moveTo(game.cup.x, game.cup.y - 20);
    ctx.lineTo(game.cup.x + 12, game.cup.y - 15);
    ctx.lineTo(game.cup.x, game.cup.y - 10);
    ctx.fill();
    
    if (game.state === 'aim' || game.state === 'pulling' || game.state === 'timing') {
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(game.ball.x, game.ball.y);
        ctx.lineTo(game.cup.x, game.cup.y);
        ctx.stroke();
    }
    
    ctx.shadowBlur = game.state === 'flying' ? 8 : 0;
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(game.ball.x, game.ball.y, game.ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    
    if (game.state === 'pulling') {
        const pct = game.pullDist / game.maxPull;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(canvas.width / 2 - 10, canvas.height - 150, 20, 100);
        ctx.fillStyle = `rgb(${Math.floor(pct*255)}, ${Math.floor((1-pct)*255)}, 0)`;
        ctx.fillRect(canvas.width / 2 - 10, canvas.height - 50, 20, -pct * 100);
    }
    
    if (game.state === 'timing') {
        ctx.strokeStyle = game.timingCircle < 12 ? '#00E676' : '#FF3D00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(game.ball.x, game.ball.y, game.timingCircle, 0, Math.PI * 2);
        ctx.stroke();
    }
}

setTimeout(() => {
    initHole();
    loop();
}, 200);
</script>
</body>
</html>
